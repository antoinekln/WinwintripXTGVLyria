<meta name="claude:viewport-fit-sides" content="cover">
<title>WinWinTrip × TGV Lyria</title>
<style>
  /*
    Layout concept: a single catalogue page floats in a dim "reading room",
    lit from above, turning between spreads with a 3D flip; a drawer of
    thumbnails slides up from the bottom rail, signage-style type on top.
  */
  :root{
    --bg-0:#0b1220;
    --bg-1:#121d33;
    --paper:#f6f3ec;
    --ink:#161a22;
    --ink-soft:#5b6472;
    --accent:#e2142d;
    --accent-dim:#9c2334;
    --line:rgba(246,243,236,0.14);
    --shadow:rgba(0,0,0,0.55);
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg-0:#0e1626;
      --bg-1:#17253f;
    }
  }
  :root[data-theme="light"]{
    --bg-0:#0e1626;
    --bg-1:#17253f;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:
      radial-gradient(ellipse 120% 70% at 50% -10%, rgba(255,255,255,0.08), transparent 60%),
      linear-gradient(180deg,var(--bg-1),var(--bg-0) 55%);
    color:var(--paper);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
    min-height:100%;
    overflow-x:hidden;
    display:flex;
    flex-direction:column;
  }
  @font-face{
    font-family:"Archivo Expanded";
    src:local("Archivo");
  }

  .top-bar{
    position:sticky;
    top:env(safe-area-inset-top,0px);
    z-index:40;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px max(18px, env(safe-area-inset-left,0px)) 12px max(18px, env(safe-area-inset-left,0px));
    padding-right:max(18px, env(safe-area-inset-right,0px));
    background:linear-gradient(180deg, rgba(11,18,32,0.92), rgba(11,18,32,0.0));
    backdrop-filter:blur(2px);
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    min-width:0;
  }
  .brand .mark{
    font-family:"Archivo",sans-serif;
    font-weight:800;
    font-size:15px;
    letter-spacing:0.08em;
    color:var(--accent);
    border:1.5px solid var(--accent);
    padding:2px 7px;
    border-radius:3px;
    flex:none;
  }
  .brand .title{
    font-family:"Archivo",sans-serif;
    font-weight:700;
    font-size:clamp(14px,3.6vw,19px);
    letter-spacing:0.01em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .brand .title small{
    display:block;
    font-family:"IBM Plex Sans",sans-serif;
    font-weight:400;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.07em;
    text-transform:uppercase;
  }

  .top-actions{display:flex;gap:8px;flex:none;}
  .icon-btn{
    width:38px;height:38px;
    border-radius:8px;
    border:1px solid var(--line);
    background:rgba(255,255,255,0.05);
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .15s, transform .15s, border-color .15s;
  }
  .icon-btn:hover{background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.3);}
  .icon-btn:active{transform:scale(0.94);}
  .icon-btn svg{width:18px;height:18px;}
  .icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  .stage-wrap{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:6px max(18px, env(safe-area-inset-left,0px)) 0 max(18px, env(safe-area-inset-left,0px));
    padding-right:max(18px, env(safe-area-inset-right,0px));
    min-height:0;
  }

  .stage{
    position:relative;
    width:100%;
    max-width:980px;
    aspect-ratio:3520/1980;
    perspective:2600px;
  }

  .book{
    position:relative;
    width:100%;
    height:100%;
    border-radius:4px;
    box-shadow:0 30px 60px -20px var(--shadow), 0 2px 0 rgba(255,255,255,0.05) inset;
    background:var(--paper);
  }

  .sheet{
    position:absolute;
    inset:0;
    border-radius:4px;
    overflow:hidden;
    will-change:transform, opacity;
    box-shadow:0 0 0 1px rgba(0,0,0,0.08) inset;
    background:var(--paper);
  }
  .sheet img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }
  .sheet::after{
    content:"";
    position:absolute;
    inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity .55s ease;
  }
  .sheet.fold-left::after{
    background:linear-gradient(90deg, rgba(0,0,0,0.35), transparent 35%);
    opacity:1;
  }
  .sheet.fold-right::after{
    background:linear-gradient(270deg, rgba(0,0,0,0.35), transparent 35%);
    opacity:1;
  }

  .spine-shade{
    position:absolute;
    top:0;bottom:0;left:0;
    width:6%;
    background:linear-gradient(90deg, rgba(0,0,0,0.18), transparent);
    pointer-events:none;
    border-radius:4px 0 0 4px;
    z-index:5;
  }

  .nav-zone{
    position:absolute;
    top:0;bottom:0;
    width:18%;
    z-index:20;
    cursor:pointer;
    background:transparent;
    border:none;
    padding:0;
  }
  .nav-zone.prev{left:0;}
  .nav-zone.next{right:0;}

  .nav-arrow{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    width:46px;height:46px;
    border-radius:50%;
    background:rgba(11,18,32,0.55);
    border:1px solid rgba(255,255,255,0.18);
    color:var(--paper);
    display:flex;align-items:center;justify-content:center;
    z-index:25;
    cursor:pointer;
    transition:background .15s, transform .15s, opacity .2s;
    backdrop-filter:blur(3px);
  }
  .nav-arrow:hover{background:rgba(226,20,45,0.85);border-color:transparent;}
  .nav-arrow:active{transform:translateY(-50%) scale(0.92);}
  .nav-arrow svg{width:20px;height:20px;}
  .nav-arrow.prev{left:-6px;}
  .nav-arrow.next{right:-6px;}
  .nav-arrow[disabled]{opacity:0;pointer-events:none;}
  @media (max-width:640px){
    .nav-arrow{width:38px;height:38px;}
    .nav-arrow.prev{left:4px;}
    .nav-arrow.next{right:4px;}
  }

  .zoom-hint{
    position:absolute;
    bottom:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:11px;
    letter-spacing:0.06em;
    color:rgba(22,26,34,0.55);
    background:rgba(255,255,255,0.72);
    padding:3px 10px;
    border-radius:999px;
    z-index:15;
    pointer-events:none;
    transition:opacity .3s;
  }

  .bottom-rail{
    flex:none;
    padding:12px max(18px, env(safe-area-inset-left,0px))
      max(14px, env(safe-area-inset-bottom,0px))
      max(18px, env(safe-area-inset-left,0px));
    padding-right:max(18px, env(safe-area-inset-right,0px));
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .progress-row{
    display:flex;
    align-items:center;
    gap:14px;
    max-width:980px;
    width:100%;
    margin:0 auto;
  }
  .page-count{
    font-family:"Archivo",sans-serif;
    font-variant-numeric:tabular-nums;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.03em;
    color:var(--paper);
    flex:none;
    min-width:52px;
  }
  .track{
    position:relative;
    flex:1;
    height:4px;
    border-radius:4px;
    background:rgba(255,255,255,0.14);
    cursor:pointer;
  }
  .track-fill{
    position:absolute;
    inset:0 auto 0 0;
    width:0%;
    border-radius:4px;
    background:var(--accent);
    transition:width .5s cubic-bezier(.4,.05,.2,1);
  }
  .track-dot{
    position:absolute;
    top:50%;
    width:11px;height:11px;
    border-radius:50%;
    background:var(--paper);
    border:2px solid var(--accent);
    transform:translate(-50%,-50%);
    transition:left .5s cubic-bezier(.4,.05,.2,1);
  }

  .thumbs-toggle{
    flex:none;
    display:flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:8px;
    height:34px;
    padding:0 11px;
    font-family:"IBM Plex Sans",sans-serif;
    font-size:12px;
    letter-spacing:0.03em;
    cursor:pointer;
  }
  .thumbs-toggle:hover{background:rgba(255,255,255,0.08);}
  .thumbs-toggle svg{width:15px;height:15px;}

  .thumb-drawer{
    max-width:980px;
    width:100%;
    margin:0 auto;
    overflow:hidden;
    max-height:0;
    transition:max-height .35s cubic-bezier(.4,.05,.2,1);
  }
  .thumb-drawer.open{max-height:116px;}
  .thumb-strip{
    display:flex;
    gap:10px;
    padding:8px 2px 4px;
    overflow-x:auto;
    scrollbar-width:thin;
  }
  .thumb{
    flex:none;
    width:128px;
    aspect-ratio:3520/1980;
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid transparent;
    opacity:0.6;
    transition:opacity .15s, border-color .15s, transform .15s;
    position:relative;
    background:#0003;
  }
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb:hover{opacity:0.9;transform:translateY(-2px);}
  .thumb.active{opacity:1;border-color:var(--accent);}
  .thumb .num{
    position:absolute;bottom:3px;right:5px;
    font-family:"Archivo",sans-serif;
    font-size:10px;font-weight:700;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.8);
  }

  .sr-only{
    position:absolute;width:1px;height:1px;
    padding:0;margin:-1px;overflow:hidden;
    clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  .lightbox{
    position:fixed;inset:0;
    background:rgba(5,8,14,0.95);
    z-index:100;
    display:none;
    align-items:center;
    justify-content:center;
    padding:max(20px, env(safe-area-inset-top,0px)) max(20px, env(safe-area-inset-right,0px)) max(20px, env(safe-area-inset-bottom,0px)) max(20px, env(safe-area-inset-left,0px));
  }
  .lightbox.open{display:flex;}
  .lightbox img{
    max-width:100%;max-height:100%;
    border-radius:3px;
    box-shadow:0 20px 60px rgba(0,0,0,0.6);
    cursor:zoom-out;
  }
  .lightbox-close{
    position:absolute;
    top:max(16px, env(safe-area-inset-top,0px));
    right:max(16px, env(safe-area-inset-right,0px));
    width:40px;height:40px;
    border-radius:50%;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.2);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }

  @media (prefers-reduced-motion:reduce){
    .sheet, .track-fill, .track-dot, .thumb-drawer{transition:none !important;}
  }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<header class="top-bar">
  <div class="brand">
    <span class="mark">WWT</span>
    <span class="title">WinWinTrip × TGV Lyria<small>Catalogue numérique</small></span>
  </div>
  <div class="top-actions">
    <button class="icon-btn" id="btnZoom" title="Agrandir la page" aria-label="Agrandir la page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    </button>
    <button class="icon-btn" id="btnFull" title="Plein écran" aria-label="Plein écran">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
    </button>
  </div>
</header>

<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="book" id="book">
      <div class="sheet" id="sheetA"><img id="imgA" alt=""></div>
      <div class="sheet" id="sheetB"><img id="imgB" alt=""></div>
      <div class="spine-shade"></div>
      <button class="nav-zone prev" id="zonePrev" aria-label="Page précédente"></button>
      <button class="nav-zone next" id="zoneNext" aria-label="Page suivante"></button>
      <button class="nav-arrow prev" id="btnPrev" aria-label="Page précédente">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="nav-arrow next" id="btnNext" aria-label="Page suivante">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
      <span class="zoom-hint" id="zoomHint">Cliquer la page pour zoomer</span>
    </div>
  </div>
</div>

<div class="bottom-rail">
  <div class="progress-row">
    <span class="page-count"><span id="curPage">1</span> / <span id="totPage">7</span></span>
    <div class="track" id="track" role="slider" aria-label="Navigation des pages" tabindex="0" aria-valuemin="1" aria-valuenow="1">
      <div class="track-fill" id="trackFill"></div>
      <div class="track-dot" id="trackDot"></div>
    </div>
    <button class="thumbs-toggle" id="btnThumbs" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      <span>Pages</span>
    </button>
  </div>
  <div class="thumb-drawer" id="thumbDrawer">
    <div class="thumb-strip" id="thumbStrip"></div>
  </div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose" aria-label="Fermer">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <img id="lightboxImg" src="" alt="Page agrandie">
</div>

<p class="sr-only" id="liveRegion" aria-live="polite"></p>

<script>
(function(){
  var TOTAL = 7;
  var pages = [];
  for (var i = 1; i <= TOTAL; i++){
    pages.push("pages/page_" + String(i).padStart(3,"0") + ".jpg");
  }

  var book = document.getElementById("book");
  var curIdx = 0; // 0-based
  var animating = false;

  var sheets = [
    {el: document.getElementById("sheetA"), img: document.getElementById("imgA")},
    {el: document.getElementById("sheetB"), img: document.getElementById("imgB")}
  ];
  var topLayer = 0;

  function setInstant(el, transform, opacity, zIndex, fold){
    el.style.transition = "none";
    el.style.transform = transform;
    el.style.opacity = String(opacity);
    el.style.zIndex = String(zIndex);
    el.classList.remove("fold-left", "fold-right");
    if (fold) el.classList.add(fold);
    void el.offsetWidth;
  }

  function initBook(){
    sheets[topLayer].img.src = pages[curIdx];
    setInstant(sheets[topLayer].el, "none", 1, 2, null);
    setInstant(sheets[1 - topLayer].el, "none", 0, 1, null);
  }

  function updateUI(){
    document.getElementById("curPage").textContent = String(curIdx + 1);
    var pct = TOTAL > 1 ? (curIdx / (TOTAL - 1)) * 100 : 0;
    document.getElementById("trackFill").style.width = pct + "%";
    document.getElementById("trackDot").style.left = pct + "%";
    document.getElementById("track").setAttribute("aria-valuenow", String(curIdx + 1));
    document.getElementById("btnPrev").disabled = curIdx === 0;
    document.getElementById("btnNext").disabled = curIdx === TOTAL - 1;
    document.getElementById("liveRegion").textContent = "Page " + (curIdx + 1) + " sur " + TOTAL;

    var thumbs = document.querySelectorAll(".thumb");
    thumbs.forEach(function(t, i){
      t.classList.toggle("active", i === curIdx);
    });
    var activeThumb = thumbs[curIdx];
    if (activeThumb && document.getElementById("thumbDrawer").classList.contains("open")){
      activeThumb.scrollIntoView({behavior:"smooth", inline:"center", block:"nearest"});
    }
  }

  function goTo(target){
    if (animating || target === curIdx || target < 0 || target > TOTAL - 1) return;
    animating = true;
    document.getElementById("zoomHint").style.opacity = "0";

    var dir = target > curIdx ? 1 : -1;
    var outgoing = sheets[topLayer];
    var incoming = sheets[1 - topLayer];

    incoming.img.src = pages[target];

    // start state for the incoming sheet: hidden behind, tilted away on the side it enters from
    setInstant(
      incoming.el,
      "rotateY(" + (dir > 0 ? 38 : -38) + "deg) scale(.95)",
      0,
      1,
      dir > 0 ? "fold-right" : "fold-left"
    );
    incoming.el.style.transformOrigin = dir > 0 ? "right center" : "left center";
    outgoing.el.style.transformOrigin = dir > 0 ? "left center" : "right center";
    outgoing.el.style.zIndex = "2";

    requestAnimationFrame(function(){
      incoming.el.style.transition = "transform .5s cubic-bezier(.3,.05,.2,1), opacity .4s ease";
      incoming.el.style.transform = "none";
      incoming.el.style.opacity = "1";
      incoming.el.classList.remove("fold-left", "fold-right");

      outgoing.el.style.transition = "transform .5s cubic-bezier(.3,.05,.2,1), opacity .4s ease";
      outgoing.el.style.transform = "rotateY(" + (dir > 0 ? -38 : 38) + "deg) scale(.95)";
      outgoing.el.style.opacity = "0";
      outgoing.el.classList.add(dir > 0 ? "fold-left" : "fold-right");
    });

    setTimeout(function(){
      topLayer = 1 - topLayer;
      curIdx = target;
      setInstant(outgoing.el, "none", 0, 1, null);
      animating = false;
      updateUI();
    }, 520);
  }

  function buildThumbs(){
    var strip = document.getElementById("thumbStrip");
    pages.forEach(function(src, i){
      var t = document.createElement("div");
      t.className = "thumb" + (i === 0 ? " active" : "");
      t.innerHTML = '<img src="' + src + '" alt="Miniature page ' + (i+1) + '" loading="lazy"><span class="num">' + (i+1) + '</span>';
      t.addEventListener("click", function(){ goTo(i); });
      strip.appendChild(t);
    });
  }

  initBook();
  buildThumbs();
  updateUI();

  document.getElementById("btnPrev").addEventListener("click", function(){ goTo(curIdx - 1); });
  document.getElementById("btnNext").addEventListener("click", function(){ goTo(curIdx + 1); });
  document.getElementById("zonePrev").addEventListener("click", function(){ goTo(curIdx - 1); });
  document.getElementById("zoneNext").addEventListener("click", function(){ goTo(curIdx + 1); });

  document.addEventListener("keydown", function(e){
    if (document.getElementById("lightbox").classList.contains("open")){
      if (e.key === "Escape") closeLightbox();
      return;
    }
    if (e.key === "ArrowRight") goTo(curIdx + 1);
    else if (e.key === "ArrowLeft") goTo(curIdx - 1);
    else if (e.key === "Home") goTo(0);
    else if (e.key === "End") goTo(TOTAL - 1);
  });

  var track = document.getElementById("track");
  track.addEventListener("click", function(e){
    var rect = track.getBoundingClientRect();
    var ratio = (e.clientX - rect.left) / rect.width;
    goTo(Math.round(ratio * (TOTAL - 1)));
  });
  track.addEventListener("keydown", function(e){
    if (e.key === "ArrowRight") goTo(curIdx + 1);
    else if (e.key === "ArrowLeft") goTo(curIdx - 1);
  });

  var thumbsOpen = false;
  var drawer = document.getElementById("thumbDrawer");
  var btnThumbs = document.getElementById("btnThumbs");
  btnThumbs.addEventListener("click", function(){
    thumbsOpen = !thumbsOpen;
    drawer.classList.toggle("open", thumbsOpen);
    btnThumbs.setAttribute("aria-expanded", String(thumbsOpen));
  });

  var lightbox = document.getElementById("lightbox");
  var lightboxImg = document.getElementById("lightboxImg");
  function openLightbox(){
    lightboxImg.src = pages[curIdx];
    lightbox.classList.add("open");
  }
  function closeLightbox(){
    lightbox.classList.remove("open");
    lightboxImg.src = "";
  }
  document.getElementById("btnZoom").addEventListener("click", openLightbox);
  book.addEventListener("click", function(e){
    if (e.target.closest(".nav-zone") || e.target.closest(".nav-arrow")) return;
    openLightbox();
  });
  lightbox.addEventListener("click", closeLightbox);
  document.getElementById("lightboxClose").addEventListener("click", function(e){
    e.stopPropagation();
    closeLightbox();
  });

  document.getElementById("btnFull").addEventListener("click", function(){
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen().catch(function(){});
    } else {
      document.exitFullscreen().catch(function(){});
    }
  });

  // touch swipe
  var touchStartX = null;
  var stage = document.getElementById("stage");
  stage.addEventListener("touchstart", function(e){
    touchStartX = e.touches[0].clientX;
  }, {passive:true});
  stage.addEventListener("touchend", function(e){
    if (touchStartX === null) return;
    var dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 40){
      if (dx < 0) goTo(curIdx + 1); else goTo(curIdx - 1);
    }
    touchStartX = null;
  }, {passive:true});

  setTimeout(function(){
    var hint = document.getElementById("zoomHint");
    if (hint) hint.style.opacity = "0";
  }, 4000);
})();
</script>
